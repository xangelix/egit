<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>egit</title>
  <!-- A branch leaving a line of commits and coming back: the commit graph's own mark. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 6v20M10 10c0 6 12 4 12 10' fill='none' stroke='%230A8477' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='6' r='4' fill='%230A8477'/%3E%3Ccircle cx='10' cy='26' r='4' fill='%230A8477'/%3E%3Ccircle cx='22' cy='20' r='4' fill='%233FB6A8'/%3E%3C/svg%3E">
  <link rel="modulepreload" href="egit_web.js">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1d22; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f4f6; } }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #problem {
      position: absolute; inset: 0; margin: auto; height: fit-content; max-width: 36rem;
      padding: 1.5rem; font: 15px/1.5 system-ui, sans-serif; color: #e6e6ea;
      background: #2a2b31; border-radius: 12px;

    @media (prefers-color-scheme: light) { #problem { color: #1c1d22; background: #fff; } }
  </style>

<body>
  <canvas id="egit"></canvas>
  <p id="problem" role="alert" hidden></p>
  <script type="module" src="start.js"></script>
