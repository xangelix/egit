[package]
name = "egit"
description = "A fast, native git client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The application as a library (the tests drive it) and the executable.
[lib]
name = "egit_app"

[[bin]]
name = "egit"
path = "src/main.rs"

[dependencies]
bstr.workspace = true
eframe = { workspace = true, features = ["default_fonts", "persistence", "wgpu"] }
egit-agents.workspace = true
egit-forge.workspace = true
egit-git.workspace = true
egit-gix.workspace = true
egit-graph.workspace = true
egit-text.workspace = true
egui.workspace = true
egui-async.workspace = true
egui-phosphor.workspace = true
egui-table-kit.workspace = true
egui_commonmark.workspace = true
egui_plot.workspace = true
egui_tiles.workspace = true
image.workspace = true
jiff.workspace = true
memchr.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
# The agents' messages, as the SDK gives them.
serde_json.workspace = true
skrifa.workspace = true
syntect.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
web-time.workspace = true
zeroize.workspace = true

# A window of its own: its screen reader's tree, and Xorg sessions (without it winit can't open
# a window outside Wayland); the desktop's dialogs; watches; jobs on threads; logging to stderr.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["accesskit", "wayland", "x11"] }
notify.workspace = true
# Native folder dialogs through the desktop portal (no GTK).
rfd = { workspace = true, features = ["xdg-portal"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }

# FSEvents, which macOS's watches need.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true, features = ["macos_fsevent"] }

[dev-dependencies]
egit-forge = { workspace = true, features = ["testing"] }
egit-git = { workspace = true, features = ["testing"] }
egui_kittest = { workspace = true, features = ["eframe", "snapshot", "wgpu"] }
ron.workspace = true

# In a browser: the page's clock and time zone, its WebSocket to the relay, its futures.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
jiff = { workspace = true, features = ["js"] }
js-sys.workspace = true
# Logs to the page's console (eframe's `WebLogger`), egit's own through tracing's records.
log = "0.4.33"
tracing = { workspace = true, features = ["log"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["BinaryType", "Blob", "CloseEvent", "Document", "Element", "EventTarget", "File", "FileList", "History", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlInputElement", "KeyboardEvent", "Location", "MessageEvent", "Navigator", "Storage", "UrlSearchParams", "WebSocket", "Window"] }

# In a browser, the page's randomness, for what egui's hashing asks of getrandom 0.3 (which also
# needs `--cfg getrandom_backend="wasm_js"`: scripts/build-web.sh gives it).
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

# getrandom 0.3 is named only to turn on the page's randomness for what egui's hashing uses.
[package.metadata.cargo-shear]
ignored = ["getrandom_03"]
