[package]
name = "egit-forge"
description = "egit's interface to forges' web APIs (GitHub, GitLab): which repository a remote is, signing in with git's credentials, and pull and merge requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A fake GitHub API for tests, on the loopback address.
testing = []

[dependencies]
bstr.workspace = true
egit-git.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
zeroize.workspace = true

# Requests made here; in a browser, its relay makes them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls.workspace = true
ureq.workspace = true

[dev-dependencies]
egit-forge = { workspace = true, features = ["testing"] }
egit-git = { workspace = true, features = ["testing"] }
