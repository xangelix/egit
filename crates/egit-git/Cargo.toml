[package]
name = "egit-git"
description = "egit's interface to the git binary: running it safely, and reading what it says."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `testing`: a sandboxed git (a temporary `HOME`, no system configuration) for tests in this
# workspace, here, over ssh, or through a relay (a WebSocket client of its own).
testing = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
# Scripts handed to the shell on another computer.
base64.workspace = true
bstr.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
# Git LFS's `--json` output.
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
zeroize.workspace = true
# The tests' WebSocket to a relay (`testing`).
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, optional = true }

# In a browser: the page's randomness, its tasks and timers.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Url", "Window"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "android"))))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
egit-git = { workspace = true, features = ["testing"] }

# Its own `main`: the test executable doubles as the askpass helper git starts.
[[test]]
name = "askpass"
harness = false
