[package]
name = "egit-git"
description = "egit's interface to the git binary: running it safely, and reading what it says."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `testing`: a sandboxed git (a temporary `HOME`, no system configuration) for tests in this
# workspace.
testing = []

[dependencies]
bstr.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
tempfile = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "android"))))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
egit-git = { workspace = true, features = ["testing"] }

# Its own `main`: the test executable doubles as the askpass helper git starts.
[[test]]
name = "askpass"
harness = false
