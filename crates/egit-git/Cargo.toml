[package]
name = "egit-git"
description = "egit's interface to the git binary: running it safely, and reading what it says."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `testing`: a sandboxed git (a temporary `HOME`, no system configuration) for tests in this
# workspace.
testing = ["dep:tempfile"]

[dependencies]
bstr.workspace = true
parking_lot.workspace = true
rustix.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
egit-git = { workspace = true, features = ["testing"] }

# Its own `main`: the test executable doubles as the askpass helper git starts.
[[test]]
name = "askpass"
harness = false
