[workspace]
resolver = "3"
members = ["crates/egit", "crates/egit-git"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Not on crates.io (and its own licence isn't chosen yet).
publish = false

[workspace.dependencies]
egit-git = { path = "crates/egit-git" }

bstr = { version = "1.13.1", default-features = false, features = ["std"] }
parking_lot = "0.12.5"
rustix = { version = "1.1.5", features = ["process"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Handle every error and every edge: none of these may reach shipped code (`clippy.toml` relaxes
# the first group inside tests).
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
as_conversions = "deny"
# egui's ecosystem pins several versions of the same crates; nothing to do about it here.
multiple_crate_versions = "allow"
# Conflicts with `unreachable_pub`, which wins: items in private modules say `pub(crate)`.
redundant_pub_crate = "allow"

[profile.dev.package."*"]
# Optimized dependencies keep a debug build's interface smooth.
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
