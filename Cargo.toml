[workspace]
resolver = "3"
members = [
    "crates/egit",
    "crates/egit-forge",
    "crates/egit-gix",
    "crates/egit-git",
    "crates/egit-graph",
    "crates/egit-text",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Not on crates.io (and its own licence isn't chosen yet).
publish = false

[workspace.dependencies]
egit-forge = { path = "crates/egit-forge" }
egit-gix = { path = "crates/egit-gix" }
egit-git = { path = "crates/egit-git" }
egit-graph = { path = "crates/egit-graph" }
egit-text = { path = "crates/egit-text" }

bstr = { version = "1.13.1", default-features = false, features = ["std"] }
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-async = "0.7.0"
egui-phosphor = "0.14.0"
# Ahead of crates.io: rows stay exact past f32 precision (Linux's 1.5M commits).
egui-table-kit = { git = "https://github.com/xangelix/egui-table-kit", rev = "b6e8761cd1f2476c2df57556be5c9bed252ce86a" }
egui_kittest = "0.36.2"
egui_tiles = "0.17.1"
# Local reads only: no network, no TLS (never `ring`).
# Its dynamic pack cache only: the static one needs `uluru` (MPL-2.0).
gix = { version = "0.89.0", default-features = false, features = ["pack-cache-lru-dynamic", "parallel", "sha1", "sha256"] }
memchr = "2.8.3"
notify = { version = "8.2.0", default-features = false }
parking_lot = "0.12.5"
rfd = { version = "0.17.2", default-features = false }
# The operating system's randomness, wherever egit runs (an askpass token).
getrandom = "0.4.3"
# `getpeereid` where rustix doesn't wrap the peer's credentials (macOS and the BSDs).
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["event", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The font parser egui uses: system fonts are checked with it before egui is given them.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Syntax highlighting with Sublime grammars, through fancy-regex (no C regex library).
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
# TLS through rustls on aws-lc-rs (never ring), certificates checked by the system's verifier
# (its trust store): no bundled roots, no OpenSSL.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"] }
unicode-width = { version = "0.2.2", default-features = false }
# Windows' process calls the standard library doesn't make (stopping git gently).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Handle every error and every edge: none of these may reach shipped code (`clippy.toml` relaxes
# the first group inside tests).
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
as_conversions = "deny"
# egui's ecosystem pins several versions of the same crates; nothing to do about it here.
multiple_crate_versions = "allow"
# Conflicts with `unreachable_pub`, which wins: items in private modules say `pub(crate)`.
redundant_pub_crate = "allow"
# Layout arithmetic in points gains neither precision nor speed from `mul_add`, only noise.
suboptimal_flops = "allow"

[profile.dev.package."*"]
# Optimized dependencies keep a debug build's interface smooth.
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
