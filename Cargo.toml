[workspace]
resolver = "3"
members = ["crates/egit", "crates/egit-git", "crates/egit-graph"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Not on crates.io (and its own licence isn't chosen yet).
publish = false

[workspace.dependencies]
egit-git = { path = "crates/egit-git" }

bstr = { version = "1.13.1", default-features = false, features = ["std"] }
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-async = "0.7.0"
egui-phosphor = "0.14.0"
egui-table-kit = "0.7.1"
egui_kittest = "0.36.2"
egui_tiles = "0.17.1"
notify = { version = "8.2.0", default-features = false }
parking_lot = "0.12.5"
rfd = { version = "0.17.2", default-features = false }
rustix = { version = "1.1.5", features = ["event", "net", "process", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Handle every error and every edge: none of these may reach shipped code (`clippy.toml` relaxes
# the first group inside tests).
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
as_conversions = "deny"
# egui's ecosystem pins several versions of the same crates; nothing to do about it here.
multiple_crate_versions = "allow"
# Conflicts with `unreachable_pub`, which wins: items in private modules say `pub(crate)`.
redundant_pub_crate = "allow"
# Layout arithmetic in points gains neither precision nor speed from `mul_add`, only noise.
suboptimal_flops = "allow"

[profile.dev.package."*"]
# Optimized dependencies keep a debug build's interface smooth.
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
