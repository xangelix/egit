name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Format, lints, docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (current git)
    runs-on: ubuntu-24.04
    env:
      # The screens are rendered (by lavapipe, Mesa's software Vulkan) and uploaded for review.
      EGIT_GUI_RENDER: "1"
      # Every way of signing is tested: none may be skipped for want of its tools.
      EGIT_REQUIRE_SIGNERS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Mesa's software renderer, and the signers (GnuPG, gpgsm, OpenSSH)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mesa-vulkan-drivers gnupg gpgsm openssh-client

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Git version
        run: git --version

      - name: Tests
        run: cargo test --workspace --locked

      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screens
          path: target/gui-screens/
          if-no-files-found: ignore

  test-floor:
    # The oldest platform egit supports: Ubuntu 24.04's glibc and its own git (2.43.0).
    name: Tests (Ubuntu 24.04, git 2.43)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      EGIT_REQUIRE_SIGNERS: "1"
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git gnupg gpgsm mesa-vulkan-drivers \
            openssh-client pkg-config

      - uses: actions/checkout@v7

      - name: Install rustup and the pinned toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check the git version is the floor
        run: |
          git --version
          git --version | grep -qx 'git version 2\.43\.[0-9]*'

      - name: Tests
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear

      - name: Advisories, licences, bans, sources
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear
