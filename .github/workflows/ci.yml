name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Format, lints, docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (current git)
    runs-on: ubuntu-24.04
    env:
      # The screens are rendered (by lavapipe, Mesa's software Vulkan) and uploaded for review.
      EGIT_GUI_RENDER: "1"
      # Every way of signing is tested: none may be skipped for want of its tools.
      EGIT_REQUIRE_SIGNERS: "1"
      # Git LFS too.
      EGIT_REQUIRE_LFS: "1"
      # And ssh's shared connections, against an sshd of the test's own.
      EGIT_REQUIRE_SSHD: "1"
      # And the agents' bridge, under the runner's Node.js, against a stand-in SDK.
      EGIT_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Mesa's software renderer, the signers (GnuPG, gpgsm, OpenSSH), Git LFS, and sshd
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mesa-vulkan-drivers gnupg gpgsm openssh-client openssh-server git-lfs

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Git version
        run: git --version

      - name: Tests
        run: cargo test --workspace --locked

      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screens
          path: target/gui-screens/
          if-no-files-found: ignore

  test-floor:
    # The oldest platform egit supports: Ubuntu 24.04's glibc and its own git (2.43.0).
    name: Tests (Ubuntu 24.04, git 2.43)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      EGIT_REQUIRE_SIGNERS: "1"
      EGIT_REQUIRE_LFS: "1"
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git git-lfs gnupg gpgsm mesa-vulkan-drivers \
            openssh-client pkg-config

      - uses: actions/checkout@v7

      - name: Install rustup and the pinned toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check the git version is the floor
        run: |
          git --version
          git --version | grep -qx 'git version 2\.43\.[0-9]*'

      - name: Tests
        run: cargo test --workspace --locked

  platforms:
    # macOS and Windows, linted and tested on each (Linux's jobs are above). Neither renders
    # screens (no GPU on these runners), nor requires every signer.
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check files out as they are (no line endings converted)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install NASM (aws-lc's assembly on Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Git version
        run: git --version

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear

      - name: Advisories, licences, bans, sources
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear
