# cargo-deny policy: advisories, licences, banned crates, and where crates may come from.

[graph]
# Every target egit ships for (Linux only, for now).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
exclude-dev = false
all-features = true

[advisories]
# Unmaintained or unsound crates fail the build; yanked versions too.
unmaintained = "all"
yanked = "deny"
ignore = [
    # bincode 1.3.3 is complete (its authors' words) and only unmaintained: syntect reads its own
    # grammar and theme dumps with it, compiled into egit, never anything from outside.
    { id = "RUSTSEC-2025-0141", reason = "syntect's bundled dumps only; complete, not vulnerable" },
]

[licenses]
# Workspace crates are unpublished and carry no licence yet.
private = { ignore = true }
confidence-threshold = 0.93
# Only licences actually present; additions are reviewed when a dependency needs them.
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0"]
exceptions = [
    # Each permissive, and scoped to the one crate that needs it: egui's bundled fonts (Ubuntu
    # Light under the Ubuntu Font Licence, emoji under the SIL Open Font License), egui's hasher
    # (zlib), and the file watcher (a public-domain dedication).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    { crate = "foldhash", allow = ["Zlib"] },
    { crate = "notify", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true
deny = [
    # egit drives the system's git binary for every repository operation (docs/ROADMAP.md): a
    # second implementation of git inside the process would disagree with the one the user runs.
    { crate = "git2", reason = "egit drives the git binary; no in-process git (docs/ROADMAP.md)" },
    { crate = "libgit2-sys", reason = "egit drives the git binary; no in-process git (docs/ROADMAP.md)" },
    # egit never speaks to the network itself (git does), so no TLS stack belongs in its graph.
    { crate = "openssl", reason = "egit makes no network connections of its own" },
    { crate = "openssl-sys", reason = "egit makes no network connections of its own" },
    { crate = "native-tls", reason = "egit makes no network connections of its own" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/xangelix/egui-table-kit"]
